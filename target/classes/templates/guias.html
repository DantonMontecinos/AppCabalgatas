<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guías - Gestión de Cabalgatas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1923; --bg-secondary: #1a2736; --bg-card: #1e2d3d;
            --bg-hover: #243447; --accent-green: #22c55e; --accent-green-dark: #16a34a;
            --accent-blue: #3b82f6; --accent-amber: #f59e0b; --accent-red: #ef4444;
            --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
            --border-color: #2d4155; --shadow-glow: 0 0 20px rgba(34,197,94,0.15);
        }
        * { box-sizing: border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg-primary); color:var(--text-primary); margin:0; min-height:100vh; }
        .sidebar { position:fixed; top:0; left:0; width:260px; height:100vh; background:var(--bg-secondary); border-right:1px solid var(--border-color); z-index:1000; display:flex; flex-direction:column; }
        .sidebar-brand { padding:24px 20px; border-bottom:1px solid var(--border-color); display:flex; align-items:center; gap:12px; }
        .sidebar-brand .brand-icon { width:42px; height:42px; background:linear-gradient(135deg,var(--accent-green),var(--accent-blue)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; }
        .sidebar-brand h5 { margin:0; font-weight:700; font-size:16px; }
        .sidebar-brand small { font-size:11px; color:var(--text-muted); }
        .sidebar-nav { flex:1; padding:16px 12px; }
        .sidebar-nav .nav-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-muted); padding:12px 12px 6px; }
        .sidebar-nav a { display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:10px; color:var(--text-secondary); text-decoration:none; font-size:14px; font-weight:500; transition:all 0.2s; margin-bottom:2px; }
        .sidebar-nav a:hover { background:var(--bg-hover); color:var(--text-primary); }
        .sidebar-nav a.active { background:linear-gradient(135deg,rgba(34,197,94,0.15),rgba(59,130,246,0.1)); color:var(--accent-green); box-shadow:var(--shadow-glow); }
        .sidebar-nav a i { font-size:18px; width:24px; text-align:center; }
        .main-content { margin-left:260px; padding:24px 32px; min-height:100vh; }
        .form-control-dark,.form-select-dark { background:var(--bg-primary); border:1px solid var(--border-color); color:var(--text-primary); border-radius:8px; padding:10px 14px; font-size:14px; }
        .form-control-dark:focus,.form-select-dark:focus { background:var(--bg-primary); border-color:var(--accent-green); color:var(--text-primary); box-shadow:0 0 0 3px rgba(34,197,94,0.15); }
        .form-label { font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
        .btn-accent { background:linear-gradient(135deg,var(--accent-green),var(--accent-green-dark)); color:white; border:none; padding:10px 20px; border-radius:10px; font-weight:600; font-size:14px; transition:all 0.2s; display:inline-flex; align-items:center; gap:8px; }
        .btn-accent:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(34,197,94,0.35); color:white; }
        .btn-ghost { background:var(--bg-hover); color:var(--text-secondary); border:1px solid var(--border-color); padding:8px 16px; border-radius:8px; font-weight:500; font-size:13px; }
        .btn-ghost:hover { background:var(--bg-secondary); color:var(--text-primary); }
        .btn-danger-soft { background:rgba(239,68,68,0.1); color:var(--accent-red); border:1px solid rgba(239,68,68,0.2); padding:6px 12px; border-radius:6px; font-size:12px; }
        .btn-danger-soft:hover { background:rgba(239,68,68,0.2); color:var(--accent-red); }
        .modal-content { background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; color:var(--text-primary); }
        .modal-header { border-bottom:1px solid var(--border-color); padding:20px 24px; }
        .modal-header .modal-title { font-weight:700; font-size:18px; }
        .modal-body { padding:24px; }
        .modal-footer { border-top:1px solid var(--border-color); padding:16px 24px; }
        .btn-close { filter:invert(1) grayscale(100%) brightness(200%); }
        .table-dark-custom { width:100%; border-collapse:separate; border-spacing:0; }
        .table-dark-custom thead th { background:var(--bg-primary); color:var(--text-muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; padding:12px 16px; border-bottom:1px solid var(--border-color); }
        .table-dark-custom tbody td { padding:12px 16px; border-bottom:1px solid var(--border-color); font-size:14px; vertical-align:middle; }
        .table-dark-custom tbody tr:hover { background:var(--bg-hover); }
        .table-dark-custom tbody tr:last-child td { border-bottom:none; }
        .badge-status { padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600; }
        .toast-container { position:fixed; top:20px; right:20px; z-index:9999; }
        .toast-custom { background:var(--bg-card); border:1px solid var(--border-color); border-radius:12px; color:var(--text-primary); box-shadow:0 8px 30px rgba(0,0,0,0.3); }
        .toast-custom.toast-success { border-left:4px solid var(--accent-green); }
        .toast-custom.toast-error { border-left:4px solid var(--accent-red); }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .animate-in { animation:fadeInUp 0.3s ease forwards; }
        .form-check-input:checked { background-color:var(--accent-green); border-color:var(--accent-green); }
        .form-check-input { background-color:var(--bg-primary); border-color:var(--border-color); }
        @media(max-width:768px) { .sidebar{display:none;} .main-content{margin-left:0;padding:16px;} }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">🐴</div>
        <div><h5>Cabalgatas</h5><small>Sistema de Gestión</small></div>
    </div>
    <div class="sidebar-nav">
        <div class="nav-label">Principal</div>
        <a href="/"><i class="bi bi-calendar3"></i> Calendario</a>
        <div class="nav-label">Gestión</div>
        <a href="/caballos"><i class="bi bi-heart-pulse"></i> Caballos</a>
        <a href="/guias" class="active"><i class="bi bi-people"></i> Guías</a>
    </div>
</nav>

<div class="toast-container" id="toastContainer"></div>

<div class="main-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
        <div>
            <h2 style="font-weight:700;font-size:24px;margin:0;">👤 Gestión de Guías</h2>
            <p style="color:var(--text-muted);font-size:13px;margin-top:2px;">
                Administra los guías disponibles para las cabalgatas
            </p>
        </div>
        <button class="btn-accent" onclick="openModal()">
            <i class="bi bi-plus-lg"></i> Nuevo Guía
        </button>
    </div>

    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;overflow:hidden;">
        <table class="table-dark-custom">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th style="text-align:right;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="guia : ${guias}">
                    <td><strong th:text="${guia.nombre}">Guía</strong></td>
                    <td style="color:var(--text-secondary);" th:text="${guia.telefono != null ? guia.telefono : '—'}">Teléfono</td>
                    <td>
                        <span th:if="${guia.activo}" class="badge-status" style="background:rgba(34,197,94,0.15);color:var(--accent-green);">
                            Activo
                        </span>
                        <span th:unless="${guia.activo}" class="badge-status" style="background:rgba(239,68,68,0.15);color:var(--accent-red);">
                            Inactivo
                        </span>
                    </td>
                    <td style="text-align:right;">
                        <button class="btn btn-ghost btn-sm me-1 btn-edit-guia"
                                th:data-id="${guia.id}"
                                th:data-nombre="${guia.nombre}"
                                th:data-telefono="${guia.telefono != null ? guia.telefono : ''}"
                                th:data-activo="${guia.activo}">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-danger-soft btn-sm btn-delete-guia"
                                th:data-id="${guia.id}">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
        <div th:if="${#lists.isEmpty(guias)}" style="text-align:center;padding:40px;color:var(--text-muted);">
            <i class="bi bi-people" style="font-size:32px;display:block;margin-bottom:8px;"></i>
            No hay guías registrados
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="guiaModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Nuevo Guía</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="guiaForm">
                    <input type="hidden" id="guiaId">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control form-control-dark" id="nombre" required placeholder="Nombre completo">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control form-control-dark" id="telefono" placeholder="Ej: +54 9 351 123 4567">
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="activo" checked>
                        <label class="form-check-label" for="activo" style="color:var(--text-secondary);font-size:14px;">
                            Activo para asignar a cabalgatas
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-accent" onclick="saveGuia()">
                    <i class="bi bi-check-lg"></i> Guardar
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showToast(message, type='success') {
        const container = document.getElementById('toastContainer');
        const icon = type==='success'?'bi-check-circle-fill':'bi-exclamation-triangle-fill';
        const toastEl = document.createElement('div');
        toastEl.className = `toast toast-custom toast-${type} animate-in`;
        toastEl.setAttribute('role','alert');
        toastEl.innerHTML = `<div class="toast-body d-flex align-items-center gap-2 py-3 px-4"><i class="bi ${icon}" style="color:var(--accent-${type==='success'?'green':'red'})"></i><span>${message}</span></div>`;
        container.appendChild(toastEl);
        const toast = new bootstrap.Toast(toastEl, {delay:4000});
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    async function apiCall(url, method='GET', data=null) {
        const options = {method, headers:{'Content-Type':'application/json'}};
        if(data) options.body = JSON.stringify(data);
        const response = await fetch(url, options);
        const result = await response.json();
        if(!response.ok) throw new Error(result.message || 'Error');
        return result;
    }

    function openModal() {
        document.getElementById('guiaId').value = '';
        document.getElementById('modalTitle').textContent = 'Nuevo Guía';
        document.getElementById('guiaForm').reset();
        document.getElementById('activo').checked = true;
        new bootstrap.Modal(document.getElementById('guiaModal')).show();
    }

    function editGuia(id, nombre, telefono, activo) {
        document.getElementById('guiaId').value = id;
        document.getElementById('modalTitle').textContent = 'Editar Guía';
        document.getElementById('nombre').value = nombre;
        document.getElementById('telefono').value = telefono;
        document.getElementById('activo').checked = activo;
        new bootstrap.Modal(document.getElementById('guiaModal')).show();
    }

    async function saveGuia() {
        const id = document.getElementById('guiaId').value;
        const data = {
            nombre: document.getElementById('nombre').value,
            telefono: document.getElementById('telefono').value,
            activo: document.getElementById('activo').checked
        };
        try {
            if (id) {
                await apiCall(`/api/guias/${id}`, 'PUT', data);
                showToast('Guía actualizado');
            } else {
                await apiCall('/api/guias', 'POST', data);
                showToast('Guía creado');
            }
            bootstrap.Modal.getInstance(document.getElementById('guiaModal')).hide();
            setTimeout(() => location.reload(), 500);
        } catch(err) {
            showToast(err.message, 'error');
        }
    }

    async function deleteGuia(id) {
        if (!confirm('¿Eliminar este guía?')) return;
        try {
            await apiCall(`/api/guias/${id}`, 'DELETE');
            showToast('Guía eliminado');
            setTimeout(() => location.reload(), 500);
        } catch(err) {
            showToast(err.message, 'error');
        }
    }

    // Event delegation for edit/delete buttons
    document.addEventListener('click', function(e) {
        const editBtn = e.target.closest('.btn-edit-guia');
        if (editBtn) {
            editGuia(editBtn.dataset.id, editBtn.dataset.nombre, editBtn.dataset.telefono, editBtn.dataset.activo === 'true');
        }
        const deleteBtn = e.target.closest('.btn-delete-guia');
        if (deleteBtn) {
            deleteGuia(deleteBtn.dataset.id);
        }
    });
</script>
</body>
</html>
